# Ambiente local do Sistema da Clínica.
# Uso: docker compose -f docker/compose.yaml --env-file docker/.env up -d
# Versões fixas; revisar mensalmente (ver ADR-0005).

name: clinic-system

services:
  postgres:
    # Manter a versão major igual à do RDS (ADR-0004).
    image: postgres:17.11-alpine3.23
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      CLINIC_MIGRATOR_PASSWORD: ${CLINIC_MIGRATOR_PASSWORD}
      CLINIC_APP_PASSWORD: ${CLINIC_APP_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  localstack:
    # Última Community sem token (ADR-0012). Não subir para 2026.03 ou mais novo: exige conta e plano pago para uso comercial.
    image: localstack/localstack:4.14.0@sha256:3ebc37595918b8accb852f8048fef2aff047d465167edd655528065b07bc364a
    environment:
      SERVICES: s3,ssm,ses
    ports:
      - "4566:4566"
    volumes:
      - localstack-data:/var/lib/localstack
      - ./localstack/init:/etc/localstack/init/ready.d:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  oidc:
    # Substitui o Cognito localmente (a aplicação valida um JWT OIDC genérico).
    image: ghcr.io/navikt/mock-oauth2-server:6.1.3
    environment:
      SERVER_PORT: "8081"
      JSON_CONFIG_PATH: /config/oidc-config.json
    ports:
      - "8081:8081"
    volumes:
      - ./oidc/oidc-config.json:/config/oidc-config.json:ro

  otel-lgtm:
    # Grafana + Tempo + Loki + Prometheus, já recebendo OTLP (ADR-0006).
    image: grafana/otel-lgtm:0.38.1
    ports:
      - "3000:3000"   # Grafana
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    volumes:
      - lgtm-data:/data

volumes:
  postgres-data:
  localstack-data:
  lgtm-data:
