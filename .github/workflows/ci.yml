name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (verify + cobertura)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml
      # Unitários, integração (Testcontainers), ArchUnit, Modulith e portão JaCoCo >= 85% (domain e application).
      - name: ./mvnw verify
        working-directory: backend
        run: ./mvnw -B verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: jacoco-report
          path: backend/target/site/jacoco
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-cyclonedx
          path: backend/target/classes/META-INF/sbom/application.cdx.json
          if-no-files-found: error

  app:
    name: app (testes + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      # Inclui o teste de contrato: o cliente versionado tem que bater com backend/openapi/openapi.yaml.
      - run: npm test
      - run: npm run build

  dependency-scan:
    name: scan de dependências (OSV-Scanner)
    needs: backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom-cyclonedx
          path: sbom
      - name: Reprova com vulnerabilidade Alta ou Crítica
        run: .github/scripts/osv-gate.sh sbom/application.cdx.json

  npm-audit:
    name: npm audit (pacotes TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: npm audit
        run: .github/scripts/npm-audit.sh

  image-scan:
    name: scan da imagem (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Constrói a imagem do backend
        run: docker build -t clinic-backend:ci backend
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: clinic-backend:ci
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: false
          trivyignores: .trivyignore.yaml

  e2e:
    name: e2e (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      # Mesmo ambiente local do desenvolvimento (valores só de desenvolvimento em docker/env.example).
      - name: Sobe Postgres, LocalStack e o OIDC mock
        run: |
          cp docker/env.example docker/.env
          docker compose -f docker/compose.yaml --env-file docker/.env up -d --wait postgres localstack oidc
      - name: Sobe o backend (perfil local)
        working-directory: backend
        run: |
          nohup ./mvnw -B spring-boot:run -Dspring-boot.run.profiles=local > ../backend.log 2>&1 &
          for i in $(seq 1 90); do
            curl -sf http://localhost:8080/actuator/health | grep -q UP && exit 0
            sleep 2
          done
          echo "backend não subiu" >&2
          tail -n 60 ../backend.log >&2
          exit 1
      - name: Instala as dependências e o Chromium
        working-directory: app
        run: |
          npm ci
          npx playwright install --with-deps chromium
      # O Vite sobe sozinho (webServer do playwright.config.ts) e encaminha /api para o backend.
      - name: Fluxo crítico (Playwright)
        working-directory: app
        run: npx playwright test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-diagnostico
          path: |
            app/test-results
            backend.log
          if-no-files-found: ignore
