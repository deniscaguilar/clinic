spring.application.name=clinic-backend

# Conexões do banco (ADR-0010). Valores vêm do ambiente; sem eles a aplicação não sobe.
clinic.database.migration.url=${CLINIC_DB_URL}
clinic.database.migration.username=${CLINIC_DB_MIGRATOR_USER:clinic_migrator}
clinic.database.migration.password=${CLINIC_DB_MIGRATOR_PASSWORD}
clinic.database.app.url=${CLINIC_DB_URL}
clinic.database.app.username=${CLINIC_DB_APP_USER:clinic_app}
clinic.database.app.password=${CLINIC_DB_APP_PASSWORD}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Upload: o contêiner barra arquivos acima de 2 MB; o limite fino de cada arquivo (logo 1 MB, favicon 256 KB) está no caso de uso.
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# Resource server OIDC (Cognito em produção, mock-oauth2-server local). Sem eles a aplicação não sobe.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${CLINIC_OIDC_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.audiences=${CLINIC_OIDC_AUDIENCE:clinic-api}
clinic.security.cors.allowed-origins=${CLINIC_CORS_ORIGINS:http://localhost:5173}

# Provedor de identidade: `local` (falso em memória) ou `cognito` (exige o id do pool). Sem valor a aplicação não sobe.
clinic.identity.provider=${CLINIC_IDENTITY_PROVIDER}
clinic.identity.cognito.user-pool-id=${CLINIC_COGNITO_USER_POOL_ID:}

# Armazenamento de arquivos: `memory` (testes) ou `s3`. Sem valor a aplicação não sobe. O endpoint só se informa no LocalStack.
clinic.storage.provider=${CLINIC_STORAGE_PROVIDER}
clinic.storage.s3.bucket=${CLINIC_S3_BUCKET:}
clinic.storage.s3.region=${CLINIC_S3_REGION:sa-east-1}
clinic.storage.s3.endpoint=${CLINIC_S3_ENDPOINT:}

# Observabilidade (ADR-0006): a aplicação só fala OTLP. O destino vem de OTEL_EXPORTER_OTLP_ENDPOINT (mapeado pelo Boot).
management.tracing.sampling.probability=${CLINIC_TRACING_SAMPLING:1.0}
management.logging.export.otlp.enabled=false
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
# O resolvedor padrão registra a mensagem da exceção, que pode citar um trecho do corpo recebido (dado de paciente).
logging.level.org.springframework.web.servlet.mvc.support.DefaultHandlerExceptionResolver=ERROR
logging.level.org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver=ERROR

# Contrato OpenAPI: só as rotas versionadas da API; sem UI.
springdoc.paths-to-match=/api/v1/**
springdoc.api-docs.path=/v3/api-docs
springdoc.api-docs.version=openapi_3_1

# Registro de eventos do Spring Modulith (plano, seção 3): publicações no schema `eventing`, criadas por migração do
# Flyway (a aplicação não tem CREATE no banco). Os eventos levam só ids.
spring.modulith.events.jdbc.schema=eventing
spring.modulith.events.jdbc.schema-initialization.enabled=false

# E-mail das notificações: `memory` (testes) ou `ses`. Sem valor a aplicação não sobe. O endpoint só se informa no LocalStack.
# O remetente (`from`) precisa ser uma identidade verificada no SES.
clinic.notifications.email.provider=${CLINIC_EMAIL_PROVIDER}
# WhatsApp: hoje só `memory` (adaptador falso); sem valor a aplicação não sobe.
clinic.notifications.whatsapp.provider=${CLINIC_WHATSAPP_PROVIDER}
clinic.notifications.email.from=${CLINIC_EMAIL_FROM:}
clinic.notifications.email.ses.region=${CLINIC_SES_REGION:sa-east-1}
clinic.notifications.email.ses.endpoint=${CLINIC_SES_ENDPOINT:}

# Worker das notificações (ADR-0011): liga o envio periódico. Desligue em instâncias só de API.
clinic.notifications.worker.enabled=${CLINIC_NOTIFICATIONS_WORKER_ENABLED:true}
clinic.notifications.worker.interval=${CLINIC_NOTIFICATIONS_WORKER_INTERVAL:PT30S}
clinic.notifications.worker.initial-delay=${CLINIC_NOTIFICATIONS_WORKER_INITIAL_DELAY:PT10S}
clinic.notifications.worker.batch-per-clinic=${CLINIC_NOTIFICATIONS_WORKER_BATCH:50}
# Retentativa com backoff exponencial: espera base * 2^(n-1), no máximo max-delay; depois de max-attempts a notificação falha.
clinic.notifications.retry.max-attempts=${CLINIC_NOTIFICATIONS_RETRY_MAX_ATTEMPTS:5}
clinic.notifications.retry.base-delay=${CLINIC_NOTIFICATIONS_RETRY_BASE_DELAY:PT1M}
clinic.notifications.retry.max-delay=${CLINIC_NOTIFICATIONS_RETRY_MAX_DELAY:PT1H}
