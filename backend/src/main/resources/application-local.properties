# Perfil `local`: aponta para o Compose (docker/compose.yaml). Só valores de desenvolvimento.
clinic.database.migration.url=jdbc:postgresql://localhost:5432/clinic
clinic.database.migration.password=migrator-local
clinic.database.app.url=jdbc:postgresql://localhost:5432/clinic
clinic.database.app.password=app-local
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/clinic
management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces
management.otlp.metrics.export.url=http://localhost:4318/v1/metrics
clinic.identity.provider=local
clinic.storage.provider=s3
clinic.storage.s3.bucket=clinic-assets
clinic.storage.s3.endpoint=http://localhost:4566
clinic.notifications.email.provider=ses
clinic.notifications.whatsapp.provider=memory
clinic.notifications.email.from=no-reply@clinica.local
clinic.notifications.email.ses.endpoint=http://localhost:4566
